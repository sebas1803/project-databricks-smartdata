name: Deploy Notebooks to Databricks PROD

on:
  push:
    branches:
      - produccion

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq & curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Export notebooks from DEV
        run: |
          DEV_HOST=${{ secrets.DATABRICKS_DEV_HOST }}
          DEV_TOKEN=${{ secrets.DATABRICKS_DEV_TOKEN }}

          NOTEBOOKS=(
            "/proyecto_smartdata/Enviroment_preparation"
            "/proyecto_smartdata/Bronze_ETL"
            "/proyecto_smartdata/Silver_ETL"
            "/proyecto_smartdata/Gold_ETL"
          )

          mkdir -p notebooks_to_deploy

          for nb in "${NOTEBOOKS[@]}"; do
            name=$(basename "$nb")
            echo "Exportando $nb ..."
            curl -s -X GET \
              -H "Authorization: Bearer $DEV_TOKEN" \
              "$DEV_HOST/api/2.0/workspace/export?path=$nb&format=SOURCE&direct_download=true" \
              --output "notebooks_to_deploy/$name.py"
          done

      - name: Import notebooks to PROD
        run: |
          PROD_HOST=${{ secrets.DATABRICKS_PROD_HOST }}
          PROD_TOKEN=${{ secrets.DATABRICKS_PROD_TOKEN }}
          DEST_BASE="/proyecto_smartdata/"

          curl -s -X POST \
            -H "Authorization: Bearer $PROD_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"$DEST_BASE\"}" \
            "$PROD_HOST/api/2.0/workspace/mkdirs"

          for file in notebooks_to_deploy/*.py; do
            name=$(basename "$file" .py)
            dest_path="$DEST_BASE$name"
            echo "Importando $file → $dest_path"

            curl -s -X POST \
              -H "Authorization: Bearer $PROD_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "path=$dest_path" \
              -F "format=SOURCE" \
              -F "language=PYTHON" \
              -F "overwrite=true" \
              -F "content=@$file" \
              "$PROD_HOST/api/2.0/workspace/import"
          done

      - name: Create or Update Databricks Workflow in PROD
        run: |
          PROD_HOST=${{ secrets.DATABRICKS_PROD_HOST }}
          PROD_TOKEN=${{ secrets.DATABRICKS_PROD_TOKEN }}
          CLUSTER_ID=${{ secrets.DATABRICKS_PROD_CLUSTER_ID }}

          WORKFLOW_NAME="WF_RETAIL_ECOMMERCE"

          # Buscar workflow existente
          workflows=$(curl -s -X GET \
            -H "Authorization: Bearer $PROD_TOKEN" \
            "$PROD_HOST/api/2.1/jobs/list")

          job_id=$(echo "$workflows" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')

          if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
            echo "Eliminando workflow existente: $job_id"
            curl -s -X POST \
              -H "Authorization: Bearer $PROD_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\": $job_id}" \
              "$PROD_HOST/api/2.1/jobs/delete"
          fi

          cat > workflow.json << EOF
          {
            "name": "$WORKFLOW_NAME",
            "format": "MULTI_TASK",
            "tasks": [
              {
                "task_key": "Bronze_ETL",
                "notebook_task": {
                  "notebook_path": "/proyecto_smartdata/Bronze_ETL",
                  "source": "WORKSPACE",
                  "base_parameters": {
                    "storage_name": "adlssmartdata0812",
                    "container": "raw",
                    "catalogo": "retail_ecommerce_prod",
                    "esquema": "bronze"
                  }
                },
                "existing_cluster_id": "$CLUSTER_ID",
                "timeout_seconds": 3600,
                "max_retries": 2
              },
              {
                "task_key": "Silver_ETL",
                "notebook_task": {
                  "notebook_path": "/proyecto_smartdata/Silver_ETL",
                  "source": "WORKSPACE",
                  "base_parameters": {
                    "catalogo": "retail_ecommerce_prod",
                    "esquema_source": "bronze",
                    "esquema_sink": "silver"
                  }
                },
                "existing_cluster_id": "$CLUSTER_ID",
                "timeout_seconds": 3600,
                "max_retries": 2,
                "depends_on": [
                  { "task_key": "Bronze_ETL" }
                ]
              },
              {
                "task_key": "Gold_ETL",
                "notebook_task": {
                  "notebook_path": "/proyecto_smartdata/Gold_ETL",
                  "source": "WORKSPACE",
                  "base_parameters": {
                    "catalogo": "retail_ecommerce_prod",
                    "esquema_source": "silver",
                    "esquema_sink": "gold"
                  }
                },
                "existing_cluster_id": "$CLUSTER_ID",
                "timeout_seconds": 3600,
                "max_retries": 2,
                "depends_on": [
                  { "task_key": "Silver_ETL" }
                ]
              }
            ]
          }
          EOF

          curl -s -X POST \
            -H "Authorization: Bearer $PROD_TOKEN" \
            -H "Content-Type: application/json" \
            -d @workflow.json \
            "$PROD_HOST/api/2.1/jobs/create"
